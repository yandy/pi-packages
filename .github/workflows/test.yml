name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter-packages.outputs.packages }}
      has_root: ${{ steps.filter.outputs.root }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            root:
              - "package.json"
              - "package-lock.json"
              - "tsconfig.base.json"
              - "vitest.config.ts"
              - "biome.json"
            pi-ask-user:
              - "pi-ask-user/**"
            pi-sandbox:
              - "pi-sandbox/**"
            pi-container-sandbox:
              - "pi-container-sandbox/**"
            pi-web-tools:
              - "pi-web-tools/**"
            pi-coding-tools:
              - "pi-coding-tools/**"
            pi-subagents:
              - "pi-subagents/**"
            pi-superpowers:
              - "pi-superpowers/**"
            pi-todo:
              - "pi-todo/**"
            pi-vision-tools:
              - "pi-vision-tools/**"
            pi-lark:
              - "pi-lark/**"
            pi-dingtalk:
              - "pi-dingtalk/**"
            pi-memory:
              - "pi-memory/**"
      - id: filter-packages
        run: echo "packages=$(echo '${{ steps.filter.outputs.changes }}' | jq -c 'map(select(. != "root"))')" >> "$GITHUB_OUTPUT"

  lockfile-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Verify package-lock.json is in sync
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json

  test-full:
    needs: changes
    if: needs.changes.outputs.has_root == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      # pi-container-sandbox 声明 "os": ["linux"]（Linux 特异包，spec D1）；npm 11 对 workspace 包
      # 同样检查 os 字段，Windows 上须 --force 才能 monorepo 安装
      # （docs/superpowers/specs/2026-10-04-windows-ci-design.md §3.4，实验已验证）。
      - run: npm ci
        if: runner.os == 'Linux'
      - run: npm ci --force
        if: runner.os == 'Windows'
      - run: npm run check:dev-deps
        if: runner.os == 'Linux'
      - run: npm run check:host-deps
        if: runner.os == 'Linux'
      - run: npm run typecheck && npm run lint && npm test
        if: runner.os == 'Linux'
      - name: Assert ast-grep platform binary installed (integration tests would silently skip otherwise)
        if: runner.os == 'Windows'
        run: node -p "require.resolve('@ast-grep/cli-win32-x64-msvc/ast-grep.exe')"
      - run: npm run test:windows
        if: runner.os == 'Windows'

  test-packages:
    needs: changes
    if: needs.changes.outputs.has_root != 'true' && needs.changes.outputs.packages != '[]' && needs.changes.outputs.packages != ''
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        package: ${{ fromJson(needs.changes.outputs.packages) }}
        exclude:
          # D1：pi-container-sandbox 是 Linux 特异包，Windows 不跑
          - package: pi-container-sandbox
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
        if: runner.os == 'Linux'
      - run: npm ci --force
        if: runner.os == 'Windows'
      - run: npm run check:dev-deps
        if: runner.os == 'Linux'
      - run: npm run check:host-deps
        if: runner.os == 'Linux'
      - run: |
          npm run typecheck -w "${{ matrix.package }}" --if-present
          npm run lint -w "${{ matrix.package }}" --if-present
          npm test -w "${{ matrix.package }}" --if-present
        if: runner.os == 'Linux'
      - name: Assert ast-grep platform binary installed (integration tests would silently skip otherwise)
        if: runner.os == 'Windows' && matrix.package == 'pi-coding-tools'
        run: node -p "require.resolve('@ast-grep/cli-win32-x64-msvc/ast-grep.exe')"
      - run: npm test -w "${{ matrix.package }}" --if-present
        if: runner.os == 'Windows'
